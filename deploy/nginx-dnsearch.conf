# DNsearch-backend 反向代理配置
# 用法：sudo cp deploy/nginx-dnsearch.conf /etc/nginx/conf.d/dnsearch.conf
#       sudo nginx -t && sudo systemctl reload nginx
# 记得把 your-domain.com 换成你的域名；只用 IP 访问就写 server_name _;

server {
    listen 80;
    server_name your-domain.com;

    # 前端静态站点（如果前端也部署在这台机器，放开下面两行，并保留 location / 的 try_files）
    # root /usr/share/nginx/html;
    # index index.html;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Node 侧已启用 trust proxy，这里传真实客户端 IP
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 需要走前端路由（History 模式）时用这段替代上面的 location /
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    # location /api/       { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    # location /dragonnest/ { proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }

    # 静态资源缓存（如果前端在这台机器上）
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }

    access_log /var/log/nginx/dnsearch.access.log;
    error_log  /var/log/nginx/dnsearch.error.log;
}
